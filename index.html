    <script>
        // --- INDEXED DB ENGINE (з підтримкою langPair) ---
        let db = null;
        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open("QuizAppWordsDB", 2);
                request.onupgradeneeded = (e) => {
                    const database = e.target.result;
                    let store;
                    if (!database.objectStoreNames.contains("words")) {
                        store = database.createObjectStore("words", { keyPath: "id", autoIncrement: true });
                    } else {
                        store = e.target.transaction.objectStore("words");
                    }
                    if (!store.indexNames.contains("level")) store.createIndex("level", "level", { unique: false });
                    if (!store.indexNames.contains("topic")) store.createIndex("topic", "topic", { unique: false });
                    if (!store.indexNames.contains("learned")) store.createIndex("learned", "learned", { unique: false });
                    if (!store.indexNames.contains("word")) store.createIndex("word", "word", { unique: false });
                    if (!store.indexNames.contains("langPair")) store.createIndex("langPair", "langPair", { unique: false });
                };
                request.onsuccess = (e) => { 
                    db = e.target.result; 
                    resolve(db); 
                };
                request.onerror = (e) => reject(e);
            });
        }

        async function saveWordsToDB(wordsList) {
            if (!db) await initDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction("words", "readwrite");
                const store = tx.objectStore("words");
                wordsList.forEach(w => {
                    store.add({
                        word: (w.word || "").trim(),
                        translation: (w.translation || "").trim(),
                        level: (w.level || "A1").toUpperCase().trim(),
                        topic: (w.topic || "General").trim(),
                        langPair: (w.langPair || activeDictPair || "en-pl").toLowerCase().trim(),
                        learned: w.learned !== undefined ? Boolean(w.learned) : false
                    });
                });
                tx.oncomplete = () => resolve();
                tx.onerror = (e) => reject(e);
            });
        }

        async function addSingleWordToDB(word, translation, level = "A1", topic = "General", langPair = activeDictPair, learned = false) {
            if (!db) await initDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction("words", "readwrite");
                const store = tx.objectStore("words");
                const req = store.add({
                    word: word.trim(),
                    translation: translation.trim(),
                    level: level.toUpperCase().trim(),
                    topic: topic.trim(),
                    langPair: (langPair || "en-pl").toLowerCase().trim(),
                    learned: Boolean(learned)
                });
                req.onsuccess = (e) => resolve(e.target.result);
                req.onerror = (e) => reject(e);
            });
        }

        async function updateWordInDB(id, word, translation, level, topic, langPair, learned) {
            if (!db) await initDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction("words", "readwrite");
                const store = tx.objectStore("words");
                const req = store.put({
                    id: Number(id),
                    word: word.trim(),
                    translation: translation.trim(),
                    level: level.toUpperCase().trim(),
                    topic: topic.trim(),
                    langPair: (langPair || "en-pl").toLowerCase().trim(),
                    learned: Boolean(learned)
                });
                req.onsuccess = () => resolve();
                req.onerror = (e) => reject(e);
            });
        }

        async function deleteWordFromDB(id) {
            if (!db) await initDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction("words", "readwrite");
                const store = tx.objectStore("words");
                const req = store.delete(Number(id));
                req.onsuccess = () => resolve();
                req.onerror = (e) => reject(e);
            });
        }

        async function getAllDBWords() {
            if (!db) await initDB();
            return new Promise((resolve) => {
                const tx = db.transaction("words", "readonly");
                const store = tx.objectStore("words");
                const req = store.getAll();
                req.onsuccess = () => {
                    const res = req.result || [];
                    res.forEach(item => {
                        if (!item.langPair) item.langPair = "en-pl";
                    });
                    resolve(res);
                };
            });
        }

        async function updateWordLearnedStatus(id, learned) {
            if (!db || !id) return;
            const tx = db.transaction("words", "readwrite");
            const store = tx.objectStore("words");
            const getReq = store.get(Number(id));
            getReq.onsuccess = () => {
                const data = getReq.result;
                if (data) {
                    data.learned = learned;
                    store.put(data);
                }
            };
        }

        async function clearDB() {
            if (!db) await initDB();
            return new Promise((resolve) => {
                const tx = db.transaction("words", "readwrite");
                tx.objectStore("words").clear();
                tx.oncomplete = () => resolve();
            });
        }

        // --- GROQ AI INTEGRATION (Визначення рівня та теми) ---
        async function fetchWordAIInfo(word, translation) {
            const apiKey = document.getElementById('groqApiKeyInput')?.value.trim() || localStorage.getItem('groq_api_key');
            if (!apiKey) {
                alert("Будь ласка, введіть ваш безкоштовний Groq API ключ у налаштуваннях бази даних нижче!");
                return null;
            }
            
            // Зберігаємо ключ у localStorage для зручності
            localStorage.setItem('groq_api_key', apiKey);

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${apiKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "qwen/qwen3.8-27b",
                        messages: [
                            {
                                role: "system",
                                content: "Ти лінгвістичний асистент. Визнач рівень CEFR (наприклад A1, A2, B1, B2, C1, C2) та коротку основну тему (наприклад Travel, Food, Appearance тощо) для слова. Поверни відповідь СУВОРО у форматі JSON без зайвого тексту: {\"level\": \"...\", \"topic\": \"...\"}"
                            },
                            {
                                role: "user",
                                content: `Визнач рівень CEFR та основну тему для слова ${word} (переклад: ${translation})`
                            }
                        ],
                        temperature: 0.1
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP помилка: ${response.status}`);
                }

                const data = await response.json();
                const content = data.choices[0].message.content;
                const jsonMatch = content.match(/\{[\s\S]*\}/);
                if (jsonMatch) {
                    return JSON.parse(jsonMatch[0]);
                }
                throw new Error("Не вдалося розібрати JSON відповідь від ШІ");
            } catch (e) {
                alert("Помилка запиту до Groq API: " + e.message);
                return null;
            }
        }

        async function autoDetectWordAI(id, word, translation) {
            const btn = document.getElementById(`ai-btn-${id}`);
            if (btn) btn.innerText = "⏳";
            
            const res = await fetchWordAIInfo(word, translation);
            if (res && res.level && res.topic) {
                const dbWords = await getAllDBWords();
                const target = dbWords.find(w => w.id === id);
                if (target) {
                    await updateWordInDB(id, target.word, target.translation, res.level.toUpperCase(), res.topic, target.langPair, target.learned);
                    refreshDBFilters();
                }
            } else {
                if (btn) btn.innerText = "🤖";
            }
        }

        let activeDictPair = 'en-pl';

        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playClickSound(type = 'correct') {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const g = ctx.createGain();
                osc.connect(g); g.connect(ctx.destination);
                osc.frequency.setValueAtTime(type === 'correct' ? 600 : 150, ctx.currentTime);
                g.gain.setValueAtTime(0.1, ctx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                osc.start(); osc.stop(ctx.currentTime + 0.1);
            } catch(e) {}
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
        }

        function updateEffectiveLangs() {
            if (swapped) {
                currentLang = baseTargetLang;
                currentAnsLang = baseSourceLang;
            } else {
                currentLang = baseSourceLang;
                currentAnsLang = baseTargetLang;
            }
            const langBtn = document.getElementById('langBtn');
            const ansLangBtn = document.getElementById('ansLangBtn');
            if (langBtn) langBtn.innerText = currentLang.toUpperCase();
            if (ansLangBtn) ansLangBtn.innerText = currentAnsLang.toUpperCase();
        }

        function toggleSwap() {
            swapped = !swapped;
            updateEffectiveLangs();
            populateVoices();
            displayQuestion();
        }

        function populateVoices() {
            voices = window.speechSynthesis.getVoices();
            
            const voiceSelect = document.getElementById('voiceSelect');
            if (voiceSelect) {
                voiceSelect.innerHTML = '';
                let filtered = voices.filter(v => v.lang.toLowerCase().includes(currentLang));
                filtered.sort((a, b) => a.name.toLowerCase().includes('google') ? -1 : 1);
                filtered.forEach((v) => {
                    const opt = document.createElement('option');
                    opt.value = voices.indexOf(v);
                    opt.textContent = `${v.name} (${v.lang})`;
                    voiceSelect.appendChild(opt);
                });
                if (filtered.length > 0) {
                    selectedVoiceIndex = voices.indexOf(filtered[0]);
                    voiceSelect.value = selectedVoiceIndex;
                }
            }

            populateAnsVoices();
        }

        function populateAnsVoices() {
            const ansVoiceSelect = document.getElementById('ansVoiceSelect');
            if (ansVoiceSelect) {
                ansVoiceSelect.innerHTML = '';
                let filteredAns = voices.filter(v => v.lang.toLowerCase().includes(currentAnsLang));
                filteredAns.sort((a, b) => a.name.toLowerCase().includes('google') ? -1 : 1);
                filteredAns.forEach((v) => {
                    const opt = document.createElement('option');
                    opt.value = voices.indexOf(v);
                    opt.textContent = `${v.name} (${v.lang})`;
                    ansVoiceSelect.appendChild(opt);
                });
                if (filteredAns.length > 0) {
                    selectedAnsVoiceIndex = voices.indexOf(filteredAns[0]);
                    ansVoiceSelect.value = selectedAnsVoiceIndex;
                }
            }
        }
        window.speechSynthesis.onvoiceschanged = populateVoices;

        function toggleLang() {
            if (activeDictPair === 'en-pl') baseSourceLang = (baseSourceLang === 'pl' ? 'en' : 'pl');
            else if (activeDictPair === 'en-uk') baseSourceLang = (baseSourceLang === 'uk' ? 'en' : 'uk');
            else if (activeDictPair === 'pl-uk') baseSourceLang = (baseSourceLang === 'uk' ? 'pl' : 'uk');
            else baseSourceLang = (baseSourceLang === 'pl' ? 'en' : 'pl');

            updateEffectiveLangs();
            populateVoices();
        }

        function toggleAnsLang() {
            if (baseTargetLang === 'pl') baseTargetLang = 'en';
            else if (baseTargetLang === 'en') baseTargetLang = 'uk';
            else baseTargetLang = 'pl';

            updateEffectiveLangs();
            populateAnsVoices();
        }

        function speakText(text) {
            if (!text) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            if (voices[selectedVoiceIndex]) utterance.voice = voices[selectedVoiceIndex];
            
            if (currentLang === 'pl') utterance.lang = 'pl-PL';
            else if (currentLang === 'uk') utterance.lang = 'uk-UA';
            else utterance.lang = 'en-US';

            utterance.rate = speechRate;
            window.speechSynthesis.speak(utterance);
        }

        function speakAnswerText(text) {
            const speakAnsEnabled = document.getElementById('speakAnsToggle')?.checked;
            if (!speakAnsEnabled || !text) return;

            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            if (voices[selectedAnsVoiceIndex]) utterance.voice = voices[selectedAnsVoiceIndex];
            
            if (currentAnsLang === 'pl') utterance.lang = 'pl-PL';
            else if (currentAnsLang === 'uk') utterance.lang = 'uk-UA';
            else utterance.lang = 'en-US';

            utterance.rate = speechRate;
            window.speechSynthesis.speak(utterance);
        }

        function getNextDelay(answerText) {
            const autoSpeed = document.getElementById('autoSpeedToggle')?.checked;
            if (autoSpeed && answerText) {
                const speakAnsEnabled = document.getElementById('speakAnsToggle')?.checked;
                if (speakAnsEnabled) {
                    const calculatedDelay = Math.ceil(500 + (answerText.length * 120 / speechRate));
                    return Math.max(1000, calculatedDelay);
                }
            }
            return currentMode === 'sprint' ? 400 : QRate / 4;
        }

        function normalize(str) {
            if(!str) return "";
            return str.toLowerCase()
                .replace(/[’'‘`]/g, "'") 
                .replace(/[.,\/#!$%\^&\*;:{}=\-_~()"?]/g, "") 
                .replace(/\s+/g, " ")
                .trim();
        }

        function loadQuestionsFromTxt(file) {
            if (!file) return;
            file.text().then(text => {
                questions = text.trim().split('\n').filter(l => l.includes(';') || l.includes('/')).map(line => {
                    let delimiter = line.includes(';') ? ';' : '/';
                    const parts = line.split(delimiter);
                    return { word: parts[0].trim(), translation: parts[1].trim(), learned: false };
                });
                document.querySelectorAll('.mode-btn').forEach(b => b.disabled = false);
                currentDictName = file.name;
                currentGroupIndex = -1;
                totalGroups = 0;
                updateDictHeader();
                resetAllInternal();
            });
        }

        function clearBalloons() {
            balloonIntervals.forEach(clearInterval);
            balloonIntervals = [];
            const stage = document.getElementById('balloonStage');
            if(stage) stage.innerHTML = '';
        }

        function spawnBalloons(correctAnswer) {
            clearBalloons();
            const stage = document.getElementById('balloonStage');
            let opts = [correctAnswer];
            while(opts.length < 4 && opts.length < questions.length) {
                let r = swapped ? questions[Math.floor(Math.random()*questions.length)].word : questions[Math.floor(Math.random()*questions.length)].translation;
                if(!opts.includes(r)) opts.push(r);
            }
            opts.sort(() => Math.random() - 0.5);

            const laneWidth = stage.offsetWidth / 4;

            opts.forEach((text, i) => {
                const b = document.createElement('div');
                b.className = 'balloon';
                b.innerText = text;
                const laneX = (i * laneWidth) + (laneWidth - 85) / 2 + (Math.random() * 10 - 5);
                b.style.left = laneX + 'px';
                b.style.top = '-120px';
                b.style.background = `hsl(${(i * 90) + Math.random()*30}, 70%, 55%)`;
                
                b.onclick = () => {
                    if (normalize(text) === normalize(correctAnswer)) {
                        playClickSound('correct');
                        speakAnswerText(correctAnswer);
                        score++; updateScore();
                        b.classList.add('popped');
                        setTimeout(nextQ, getNextDelay(correctAnswer));
                    } else {
                        playClickSound('wrong');
                        scoreError++; updateScore();
                        b.classList.add('wrong-shake');
                        setTimeout(() => b.classList.remove('wrong-shake'), 300);
                    }
                };
                stage.appendChild(b);

                let currentTop = -120;
                let speed = (0.3 + (1500 / QRate)) * (0.8 + Math.random() * 0.4);
                let delay = Math.random() * 2000;

                setTimeout(() => {
                    let move = setInterval(() => {
                        currentTop += speed;
                        b.style.top = currentTop + 'px';
                        if (currentTop > stage.offsetHeight) {
                            if (normalize(text) === normalize(correctAnswer)) nextQ();
                            b.remove();
                            clearInterval(move);
                        }
                    }, 25);
                    balloonIntervals.push(move);
                }, delay);
            });
        }

        function setMode(mode, hasTimer = false) {
            resetAllInternal();
            currentMode = mode;
            builderMode = (mode === 'wordBuilder');
            document.getElementById('balloonStage').style.display = (mode === 'balloons') ? 'block' : 'none';
            if (hasTimer) {
                timeLeft = 60;
                document.getElementById('timerDisplay').style.display = 'block';
                timer = setInterval(() => {
                    timeLeft--;
                    document.getElementById('timerDisplay').innerText = "Час: " + timeLeft;
                    if (timeLeft <= 0) { clearInterval(timer); alert("Час вийшов!"); resetAllInternal(); }
                }, 1000);
            }
            nextQ();
        }

        async function toggleCurrentWordLearned() {
            if (currentQuestionIndex < 0 || currentQuestionIndex >= questions.length) return;
            const q = questions[currentQuestionIndex];
            q.learned = !q.learned;
            if (q.id) {
                await updateWordLearnedStatus(q.id, q.learned);
            }
            displayQuestion();
        }

        async function addCurrentWordToDB() {
            if (currentQuestionIndex < 0 || currentQuestionIndex >= questions.length) return;
            const q = questions[currentQuestionIndex];
            
            if (q.id) {
                alert("Це слово вже знаходиться у вашій IndexedDB базі!");
                return;
            }

            try {
                const newId = await addSingleWordToDB(q.word, q.translation, "A1", "General", activeDictPair, q.learned || false);
                q.id = newId;
                alert(`Слово "${q.word}" успішно додано до IndexedDB!`);
                displayQuestion();
            } catch(e) {
                alert("Помилка збереження слова у DB: " + e.message);
            }
        }

        function getWordWithMissingChars(word) {
            if (!word) return '';
            let result = word.split('');
            let validIndices = [];
            
            for(let i = 0; i < word.length; i++) {
                if (/[a-zA-Zа-яА-ЯіІїЇєЄążśźęćńółĄŻŚŹĘĆŃÓŁ]/.test(word[i])) {
                    validIndices.push(i);
                }
            }
            
            let countToHide = Math.max(1, Math.ceil(validIndices.length * 0.35));
            let hidden = 0;
            
            while(hidden < countToHide && validIndices.length > 0) {
                let r = Math.floor(Math.random() * validIndices.length);
                let charIdx = validIndices[r];
                result[charIdx] = '_';
                validIndices.splice(r, 1);
                hidden++;
            }
            return result.join('');
        }

        function displayQuestion() {
            const container = document.getElementById('questionContainer');
            if (!questions.length) return;
            
            const skipLearned = document.getElementById('skipLearnedToggle')?.checked;
            if (skipLearned) {
                const unlearnedCount = questions.filter(q => !q.learned).length;
                if (unlearnedCount > 0) {
                    let attempts = 0;
                    while (questions[currentQuestionIndex]?.learned && attempts < questions.length) {
                        currentQuestionIndex++;
                        if (currentQuestionIndex >= questions.length) currentQuestionIndex = 0;
                        attempts++;
                    }
                }
            }

            if (currentQuestionIndex < 0 || currentQuestionIndex >= questions.length) {
                container.innerHTML = `<h3>Кінець! ✅</h3><button title="Почати вправу спочатку" onclick="resetAllInternal(); nextQ()">Знову</button>`;
                clearBalloons();
                return;
            }
            const q = questions[currentQuestionIndex];
            const qText = swapped ? q.translation : q.word; 
            const aText = swapped ? q.word : q.translation; 
            const isHintActive = document.getElementById('hintToggle')?.checked;
            
            if (currentMode !== 'fillGaps' && !builderMode) speakText(qText);
            
            const replayBtnHtml = `<button class="replay-btn" title="Прослухати вимову слова" onclick="speakText('${qText.replace(/'/g, "\\'")}')">🔊</button>`;
            
            let actionButtonsHtml = `<div class="word-actions">`;
            actionButtonsHtml += `<button title="${q.learned ? 'Забрати з вивчених' : 'Позначити як вивчене'}" class="action-btn-icon learned-btn ${q.learned ? 'is-learned' : ''}" onclick="toggleCurrentWordLearned()">✔</button>`;
            if (q.id) {
                actionButtonsHtml += `<button title="Вже збережено в DB" class="action-btn-icon add-db-btn in-db" disabled>+</button>`;
            } else {
                actionButtonsHtml += `<button title="Додати це слово до вашої IndexedDB" class="action-btn-icon add-db-btn" onclick="addCurrentWordToDB()">+</button>`;
            }
            actionButtonsHtml += `</div>`;

            let contentHtml = `<h3><span>${qText}</span> ${replayBtnHtml}</h3>${actionButtonsHtml}`;
            
            if (currentMode === 'balloons') {
                container.innerHTML = contentHtml;
                spawnBalloons(aText);
            } else if (builderMode || currentMode === 'wordBuilder') {
                builderCurrentIndex = 0; builderWrongCount = 0;
                const target = aText;
                const letters = target.split('').sort(() => Math.random() - 0.5);
                contentHtml = `<h3><span>${qText}</span> ${replayBtnHtml}</h3>${actionButtonsHtml}<input type="text" id="userInput" readonly placeholder="${isHintActive ? target : ''}"><div class="letter-pool"></div>`;
                container.innerHTML = contentHtml;
                const pool = container.querySelector('.letter-pool');
                letters.forEach(l => {
                    const btn = document.createElement('button');
                    btn.className = `letter-btn ${l===' '?'space-btn':''}`;
                    btn.innerText = l===' '?'␣':l;
                    btn.title = `Натисніть букви " ${l} "`;
                    btn.onclick = () => handleLetterClick(btn, l, target);
                    pool.appendChild(btn);
                });
            } else if (currentMode === 'fillGaps') {
                const targetWord = aText;
                const questionWord = qText;
                contentHtml = `<h3><span>${questionWord}</span> ${replayBtnHtml}</h3>${actionButtonsHtml}<div style="font-size:22px; letter-spacing:3px; margin:10px; font-family:monospace; text-align:center;">${getWordWithMissingChars(targetWord)}</div><input type="text" id="userInput" autofocus autocomplete="off" placeholder="${isHintActive ? targetWord : '...'}" onkeydown="if(event.key==='Enter') checkInput('${targetWord.replace(/'/g, "\\'")}')"><button style="background:#4CAF50; color:white;" id="actionBtn" title="Перевірити відповідь" onclick="checkInput('${targetWord.replace(/'/g, "\\'")}')">Ок</button>`;
                container.innerHTML = contentHtml;
            } else if (currentMode === 'flashcard') {
                contentHtml = `<div class="card-scene"><div class="card" title="Натисніть для переворотy" onclick="this.classList.toggle('is-flipped'); if(this.classList.contains('is-flipped')) speakAnswerText('${aText.replace(/'/g, "\\'")}')"><div class="card__face card__face--front">${qText}</div><div class="card__face card__face--back">${aText}</div></div></div>${actionButtonsHtml}`;
                container.innerHTML = contentHtml;
            } else if (currentMode === 'trueFalse') {
                const isCorrect = Math.random() > 0.5;
                const displayA = isCorrect ? aText : (swapped ? questions[Math.floor(Math.random()*questions.length)].word : questions[Math.floor(Math.random()*questions.length)].translation);
                contentHtml = `<h3><span>${qText} = ${displayA}?</span> ${replayBtnHtml}</h3>${actionButtonsHtml}<button class="answerBtn" title="Вибрати Правда" onclick="checkTF(this, ${isCorrect}, true, '${aText.replace(/'/g, "\\'")}')">Правда</button><button class="answerBtn" title="Вибрати Неправда" onclick="checkTF(this, ${isCorrect}, false, '${aText.replace(/'/g, "\\'")}')">Неправда</button>`;
                container.innerHTML = contentHtml;
            } else {
                if (inputMode) {
                    contentHtml += `<input type="text" id="userInput" autofocus autocomplete="off" placeholder="${isHintActive ? aText : '...'}" onkeydown="if(event.key==='Enter') checkInput('${aText.replace(/'/g, "\\'")}')"><button style="background:#4CAF50; color:white;" id="actionBtn" title="Перевірити відповідь" onclick="checkInput('${aText.replace(/'/g, "\\'")}')">Ок</button>`;
                } else {
                    let opts = [aText];
                    while(opts.length < 4 && opts.length < questions.length) {
                        let r = swapped ? questions[Math.floor(Math.random()*questions.length)].word : questions[Math.floor(Math.random()*questions.length)].translation;
                        if(!opts.includes(r)) opts.push(r);
                    }
                    opts.sort(() => Math.random() - 0.5).forEach(o => { 
                        contentHtml += `<button class="answerBtn" title="Вибрати варіант відповіді" onclick="checkBtn(this, '${aText.replace(/'/g, "\\'")}')">${o}</button>`; 
                    });
                }
                container.innerHTML = contentHtml;
            }

            const feedbackDiv = document.createElement('div');
            feedbackDiv.id = 'feedback';
            container.appendChild(feedbackDiv);

            const navHtml = document.createElement('div');
            navHtml.className = 'nav-controls';
            navHtml.innerHTML = `<button title="Попереднє питання" onclick="prevQ()">⬅</button><button title="Наступне питання" onclick="nextQ()">➡</button>`;
            if (!(currentMode.includes('sprint') || currentMode === 'balloons')) {
                container.appendChild(navHtml);
            }

            updateScore();
            if ((inputMode || currentMode === 'fillGaps') && !builderMode) setTimeout(() => document.getElementById('userInput')?.focus(), 100);
        }

        function handleLetterClick(btn, char, target) {
            const display = document.getElementById('userInput');
            if (btn.classList.contains('wrong-letter')) return;

            const simplify = (s) => s.toLowerCase().replace(/[’'‘`]/g, "'");
            let targetChar = target[builderCurrentIndex];

            if (simplify(char) === simplify(targetChar)) {
                playClickSound('correct');
                display.value += targetChar;
                builderCurrentIndex++;
                btn.style.visibility = 'hidden';
                document.querySelectorAll('.letter-btn').forEach(b => b.classList.remove('wrong-letter'));
                if (builderCurrentIndex >= target.length) {
                    score++; updateScore(); speakAnswerText(target); setTimeout(nextQ, getNextDelay(target));
                }
            } else {
                playClickSound('wrong');
                btn.classList.add('wrong-letter');
                builderWrongCount++; scoreError++; updateScore();
                if (builderWrongCount >= 3) {
                    document.getElementById('feedback').innerHTML = getColoredError(target);
                    speakAnswerText(target);
                }
            }
        }

        function checkInput(correct) {
            const input = document.getElementById('userInput');
            if (!input) return;
            if (normalize(input.value) === normalize(correct)) {
                input.style.backgroundColor = "#2e7d32"; input.style.color = "white";
                score++; updateScore(); speakAnswerText(correct);
                setTimeout(nextQ, getNextDelay(correct));
            } else {
                input.style.backgroundColor = "#d32f2f"; input.style.color = "white";
                document.getElementById('feedback').innerHTML = getColoredError(correct);
                scoreError++; updateScore(); speakAnswerText(correct);
                const btn = document.getElementById('actionBtn');
                if (btn) {
                    btn.innerText = "Далі"; 
                    btn.onclick = nextQ;
                }
            }
        }

        function checkTF(btn, isCorrect, userChoice, correctText) {
            if (isCorrect === userChoice) { 
                btn.style.backgroundColor = "#2e7d32"; btn.style.color = "white";
                score++; setTimeout(nextQ, getNextDelay(correctText)); 
            } else { 
                btn.style.backgroundColor = "#d32f2f"; btn.style.color = "white";
                document.getElementById('feedback').innerHTML = getColoredError(correctText) + `<button title="Перейти до наступного слова" onclick="nextQ()" style="margin-top:10px; background:#555; color:white; width:80%;">Далі</button>`;
                scoreError++; updateScore();
            }
            speakAnswerText(correctText);
        }

        function checkBtn(btn, correct) {
            if (normalize(btn.innerText) === normalize(correct)) { 
                btn.style.backgroundColor = "#2e7d32"; btn.style.color = "white";
                score++; setTimeout(nextQ, getNextDelay(correct)); 
            } else { 
                btn.style.backgroundColor = "#d32f2f"; btn.style.color = "white";
                document.getElementById('feedback').innerHTML = getColoredError(correct) + `<button title="Перейти до наступного слова" onclick="nextQ()" style="margin-top:10px; background:#555; color:white; width:80%;">Далі</button>`;
                scoreError++; updateScore();
            }
            speakAnswerText(correct);
        }

        function nextQ() { 
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++; 
            } else {
                currentQuestionIndex = questions.length;
            }
            displayQuestion(); 
        }

        function prevQ() { if(currentQuestionIndex > 0) { currentQuestionIndex--; displayQuestion(); } }
        
        function resetAllInternal() {
            clearInterval(timer); window.speechSynthesis.cancel();
            clearBalloons();
            currentQuestionIndex = 0; score = 0; scoreError = 0;
            document.getElementById('timerDisplay').style.display = 'none';
            document.getElementById('balloonStage').style.display = 'none';
            document.getElementById('questionContainer').innerHTML = ''; 
            updateScore();
        }

        function toggleBuilderMode() { builderMode = !builderMode; displayQuestion(); }
        function toggleInputMode() { builderMode = false; inputMode = !inputMode; displayQuestion(); }
        
        function updateScore() { 
            const total = questions.length || 0;
            const current = (currentQuestionIndex < 0 || questions.length === 0) ? 0 : Math.min(currentQuestionIndex + 1, total);
            document.getElementById('score').innerHTML = `✅ ${score} | ❌ <span style="color:red">${scoreError}</span><br><small>Питання: ${current}/${total}</small>`; 
        }

        function getColoredError(correct) {
            return `<div class="error-hint"><span class="txt-red">Невірно!</span> <br> <span class="txt-purple">${correct}</span></div>`;
        }

        // --- СЛОВНИК ТА НАВІГАЦІЯ ---
        function openDictionary() {
            document.getElementById('dictModal').style.display = 'block';
            // Підтягуємо збережений Groq ключ
            const savedKey = localStorage.getItem('groq_api_key');
            if (savedKey) {
                document.getElementById('groqApiKeyInput').value = savedKey;
            }
            refreshDBFilters();
        }

        function openIndexedDBManager() {
            document.getElementById('dictBookSelect').value = 'indexedDB';
            openDictionary();
        }

        function updateDictHeader() {
            const header = document.getElementById('dictInfoPanel');
            const prevBtn = document.getElementById('prevGroupBtn');
            const nextBtn = document.getElementById('nextGroupBtn');

            if (currentDictName) {
                let groupText = currentGroupIndex >= 0 ? ` — Група ${currentGroupIndex + 1}/${totalGroups}` : '';
                header.innerText = `${currentDictName}${groupText}`;
            } else {
                header.innerText = '';
            }

            if (currentGroupIndex >= 0 && totalGroups > 0) {
                prevBtn.style.display = 'inline-block';
                nextBtn.style.display = 'inline-block';
                prevBtn.disabled = currentGroupIndex === 0;
                nextBtn.disabled = currentGroupIndex === totalGroups - 1;
            } else {
                prevBtn.style.display = 'none';
                nextBtn.style.display = 'none';
            }
        }

        function changeGroup(direction) {
            let newIndex = currentGroupIndex + direction;
            if (newIndex >= 0 && newIndex < totalGroups) {
                const pair = activeDictPair;
                const bookChoice = document.getElementById('dictBookSelect').value;
                if (bookChoice === 'indexedDB') {
                    renderDictionaryGroups(newIndex);
                } else {
                    const rawData = (bookChoice === 'unit1') ? vocabularyList1 : vocabularyList2;
                    const lines = rawData.trim().split('\n');
                    const chunkSize = wordsPerGroup;
                    const groupLines = lines.slice(newIndex * chunkSize, (newIndex + 1) * chunkSize);
                    
                    currentGroupIndex = newIndex;
                    loadDictionaryGroup(groupLines, pair, newIndex, totalGroups);
                }
            }
        }

        // --- МОДАЛЬНЕ ВІКНО РЕДАГУВАННЯ СЛОВА ---
        let editingWordId = null;

        function openEditModal(id, word, translation, level, topic, langPair, learned) {
            editingWordId = id;
            document.getElementById('editWordInput').value = word;
            document.getElementById('editTransInput').value = translation;
            document.getElementById('editLevelInput').value = level || "A1";

            document.getElementById('editLangPairInput').value = langPair || "en-pl";
            document.getElementById('editLearnedSelect').value = learned ? "true" : "false";
            document.getElementById('editModal').style.display = 'block';

        async function saveWordChanges() {
            if (!editingWordId) return;
            const word = document.getElementById('editWordInput').value.trim();
            const trans = document.getElementById('editTransInput').value.trim();
            const level = document.getElementById('editLevelInput').value.trim() || "A1";
            const topic = document.getElementById('editTopicInput').value.trim() || "General";
            const langPair = document.getElementById('editLangPairInput').value;
            const learned = document.getElementById('editLearnedSelect').value === "true";

        async function deleteDBWordPrompt(id, wordText) {
            if (confirm(`Ви дійсно бажаєте видалити слово "${wordText}" з IndexedDB?`)) {
                await deleteWordFromDB(id);
                refreshDBFilters();

        function updateWordsPerGroupVal() {
            const val = parseInt(document.getElementById('wordsPerGroupInput').value);
            if (val > 0) {
                wordsPerGroup = val;
                renderDictionaryGroups();
            }
        }

        async function renderDictionaryGroups(autoLoadGroupIndex = -1) {
            const container = document.getElementById('dictGroupsContainer');
            container.innerHTML = '';
            const pair = document.getElementById('dictPairSelect').value;
            const bookChoice = document.getElementById('dictBookSelect').value;
            
            const wordsPerGroupVal = parseInt(document.getElementById('wordsPerGroupInput')?.value) || 20;
            wordsPerGroup = wordsPerGroupVal;

            if (bookChoice === 'indexedDB') {
                currentDictName = "IndexedDB База даних";
                activeDictPair = pair;
                
                const dbWords = await getAllDBWords();
                const filterLevel = document.getElementById('dbFilterLevel')?.value || 'ALL';
                const filterTopic = document.getElementById('dbFilterTopic')?.value || 'ALL';
                const filterLangPair = document.getElementById('dbFilterLangPair')?.value || 'ALL';
                const filterStatus = document.getElementById('dbFilterStatus')?.value || 'ALL';
                const searchQuery = (document.getElementById('dbSearchInput')?.value || '').toLowerCase().trim();

                let filtered = dbWords.filter(w => {
                    if (filterLevel !== 'ALL' && (w.level || 'A1').toUpperCase() !== filterLevel) return false;
                    if (filterTopic !== 'ALL' && (w.topic || 'General') !== filterTopic) return false;
                    if (filterLangPair !== 'ALL' && (w.langPair || 'en-pl').toLowerCase() !== filterLangPair.toLowerCase()) return false;
                    if (filterStatus === 'LEARNED' && !w.learned) return false;
                    if (filterStatus === 'UNLEARNED' && w.learned) return false;
                    if (searchQuery) {
                        const wordMatch = (w.word || '').toLowerCase().includes(searchQuery);
                        const transMatch = (w.translation || '').toLowerCase().includes(searchQuery);
                        if (!wordMatch && !transMatch) return false;
                    }
                    return true;
                });

                if (filtered.length === 0) {
                    container.innerHTML = `<p style="text-align:center; opacity:0.7;">Не знайдено слів із задекларованими фільтрами у базі IndexedDB.</p>`;
                    return;
                }

                const chunkSize = wordsPerGroup;
                totalGroups = Math.ceil(filtered.length / chunkSize);

                if (autoLoadGroupIndex >= 0 && autoLoadGroupIndex < totalGroups) {
                    const groupItems = filtered.slice(autoLoadGroupIndex * chunkSize, (autoLoadGroupIndex + 1) * chunkSize);
                    loadDBGroup(groupItems, pair, autoLoadGroupIndex, totalGroups);
                    return;
                }

                for (let i = 0; i < filtered.length; i += chunkSize) {
                    const groupItems = filtered.slice(i, i + chunkSize);
                    const groupIndex = i / chunkSize;
                    const groupDiv = document.createElement('div');
                    groupDiv.style.borderBottom = "1px solid var(--border-color)";
                    groupDiv.style.padding = "10px 0";

                    let listHtml = `<h4 style="margin:0 0 5px 0; color:#2196F3;">Група ${groupIndex + 1} (${groupItems.length} слів)</h4>`;
                    
                    groupItems.forEach(w => {
                        const escWord = (w.word || '').replace(/'/g, "\\'").replace(/"/g, "&quot;");
                        const escTrans = (w.translation || '').replace(/'/g, "\\'").replace(/"/g, "&quot;");
                        const escTopic = (w.topic || 'General').replace(/'/g, "\\'").replace(/"/g, "&quot;");
                        const lp = (w.langPair || 'en-pl').toUpperCase();
                        
                        listHtml += `<div class="db-item-row">
                            <span style="font-size:12px; line-height:1.3;">
                                <strong>${w.word}</strong> - ${w.translation} 
                                <br><small style="opacity:0.7;">[${w.level || 'A1'} | ${w.topic || 'General'} | ${lp}] ${w.learned ? '✔ Вивчено' : '❌ Не вивчено'}</small>
                            </span>
                            <div class="db-item-ops">
                                <button class="db-op-btn" id="ai-btn-${w.id}" title="Автовизначення рівня та теми через ШІ (Groq)" onclick="autoDetectWordAI(${w.id}, '${escWord}', '${escTrans}')" style="background:#e3f2fd; color:#0d47a1;">🤖</button>
                                <button class="db-op-btn" title="Редагувати слово" onclick="openEditModal(${w.id}, '${escWord}', '${escTrans}', '${w.level || 'A1'}', '${escTopic}', '${w.langPair || 'en-pl'}', ${w.learned})">✏️</button>
                                <button class="db-op-btn" style="background:#ffebee; color:#d32f2f;" title="Видалити слово" onclick="deleteDBWordPrompt(${w.id}, '${escWord}')">🗑</button>
                            </div>
                        </div>`;
                    });

                    groupDiv.innerHTML = listHtml;

                    const btn = document.createElement('button');
                    btn.innerText = "Вивчити цю групу";
                    btn.style.fontSize = "12px";
                    btn.style.padding = "6px 12px";
                    btn.style.marginTop = "8px";
                    btn.onclick = () => loadDBGroup(groupItems, pair, groupIndex, totalGroups);
                    groupDiv.appendChild(btn);

                    container.appendChild(groupDiv);
                }
                return;
            }

            const bookSelectElem = document.getElementById('dictBookSelect');
            currentDictName = bookSelectElem.options[bookSelectElem.selectedIndex].text;
            activeDictPair = pair;
            
            const rawData = (bookChoice === 'unit1') ? vocabularyList1 : vocabularyList2;
            const lines = rawData.trim().split('\n');
            const chunkSize = wordsPerGroup;
            totalGroups = Math.ceil(lines.length / chunkSize);
            
            for (let i = 0; i < lines.length; i += chunkSize) {
                const groupLines = lines.slice(i, i + chunkSize);
                const groupIndex = i / chunkSize;
                const groupDiv = document.createElement('div');
                groupDiv.style.borderBottom = "1px solid var(--border-color)";
                groupDiv.style.padding = "10px 0";
                
                let preview = groupLines.slice(0, 3).map(l => {
                    let p = l.split(';');
                    if(pair === 'en-pl') return `${p[0]} - ${p[1]}`;
                    if(pair === 'en-uk') return `${p[0]} - ${p[2]}`;
                    return `${p[1]} - ${p[2]}`;
                }).join('<br>');
                
                groupDiv.innerHTML = `<h4 style="margin:0 0 5px 0; color:#2196F3;">Група ${groupIndex + 1} (${groupLines.length} слів)</h4>
                                      <div style="font-size:12px; opacity:0.8; margin-bottom:8px;">${preview}...</div>`;
                
                const btn = document.createElement('button');
                btn.innerText = "Вивчити";
                btn.style.fontSize = "12px";
                btn.style.padding = "6px 12px";
                btn.onclick = () => loadDictionaryGroup(groupLines, pair, groupIndex, totalGroups);
                groupDiv.appendChild(btn);
                
                container.appendChild(groupDiv);
            }
        }

        function loadDBGroup(groupItems, pair, groupIndex = -1, total = 0) {
            questions = groupItems.map(item => ({
                id: item.id,
                word: item.word,
                translation: item.translation,
                learned: item.learned || false
            }));

            if (pair === 'en-pl') { baseSourceLang = 'en'; baseTargetLang = 'pl'; }
            else if (pair === 'en-uk') { baseSourceLang = 'en'; baseTargetLang = 'uk'; }
            else if (pair === 'pl-uk') { baseSourceLang = 'pl'; baseTargetLang = 'uk'; }
            
            updateEffectiveLangs();
            
            currentGroupIndex = groupIndex;
            totalGroups = total;
            updateDictHeader();

            populateVoices();
            document.querySelectorAll('.mode-btn').forEach(b => b.disabled = false);
            document.getElementById('dictModal').style.display = 'none';
            resetAllInternal();
            displayQuestion();
        }

        function loadDictionaryGroup(groupLines, pair, groupIndex = -1, total = 0) {
            questions = groupLines.map(line => {
                const p = line.split(';');
                let w, t;
                if(pair === 'en-pl') { w = p[0]; t = p[1]; }
                else if(pair === 'en-uk') { w = p[0]; t = p[2]; }
                else if(pair === 'pl-uk') { w = p[1]; t = p[2]; }
                return { word: w.trim(), translation: t.trim(), learned: false };
            });
            
            if (pair === 'en-pl') { baseSourceLang = 'en'; baseTargetLang = 'pl'; }
            else if (pair === 'en-uk') { baseSourceLang = 'en'; baseTargetLang = 'uk'; }
            else if (pair === 'pl-uk') { baseSourceLang = 'pl'; baseTargetLang = 'uk'; }
            
            updateEffectiveLangs();
            
            currentGroupIndex = groupIndex;
            totalGroups = total;
            updateDictHeader();

            populateVoices();
            document.querySelectorAll('.mode-btn').forEach(b => b.disabled = false);
            document.getElementById('dictModal').style.display = 'none';
            resetAllInternal();
            displayQuestion();
        }

        // --- ІМПОРТ, ЕКСПОРТ ТА РУЧНЕ ДОДАВАННЯ ---
        async function createNewWordInDB() {
            const word = document.getElementById('newWordInput').value.trim();
            const translation = document.getElementById('newTransInput').value.trim();
            const level = document.getElementById('newLevelInput').value.trim() || "A1";
            const topic = document.getElementById('newTopicInput').value.trim() || "General";
            const langPair = document.getElementById('newLangPairInput').value;

            if (!word || !translation) {
                alert("Будь ласка, введіть і слово, і його переклад!");
                return;
            }

            try {
                await addSingleWordToDB(word, translation, level, topic, langPair, false);
                alert(`Слово "${word}" збережено у базу (${langPair.toUpperCase()})!`);
                document.getElementById('newWordInput').value = '';
                document.getElementById('newTransInput').value = '';
                refreshDBFilters();
            } catch(e) {
                alert("Помилка збереження: " + e.message);
            }
        }

        async function exportDBData(format) {
            const words = await getAllDBWords();
            if (words.length === 0) {
                alert("База даних порожня! Немає що експортувати.");
                return;
            }

            let fileContent = "";
            let mimeType = "text/plain";
            let fileName = `backup_words_${new Date().toISOString().slice(0,10)}`;

            if (format === 'json') {
                const cleanData = words.map(w => ({
                    word: w.word,
                    translation: w.translation,
                    level: w.level || "A1",
                    topic: w.topic || "General",
                    langPair: w.langPair || "en-pl",
                    learned: Boolean(w.learned)
                }));
                fileContent = JSON.stringify(cleanData, null, 2);
                mimeType = "application/json";
                fileName += ".json";
            } else if (format === 'txt') {
                fileContent = words.map(w => `${w.word};${w.translation};${w.level || "A1"};${w.topic || "General"};${w.langPair || "en-pl"};${w.learned ? 'learned' : 'unlearned'}`).join('\n');
                mimeType = "text/plain";
                fileName += ".txt";
            }

            const blob = new Blob([fileContent], { type: mimeType });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = fileName;
            link.click();
            URL.revokeObjectURL(link.href);
        }

        async function processDBImportFile() {
            const input = document.getElementById('dbFileInput');
            if (!input.files || !input.files[0]) {
                alert("Будь ласка, оберіть файл!");
                return;
            }
            const file = input.files[0];
            const text = await file.text();
            let parsed = [];

            try {
                if (file.name.endsWith('.json')) {
                    parsed = JSON.parse(text);
                } else {
                    const lines = text.trim().split('\n');
                    parsed = lines.map(line => {
                        const parts = line.split(';');
                        const statusPart = parts[5] ? parts[5].trim().toLowerCase() : (parts[4] ? parts[4].trim().toLowerCase() : '');
                        const isLearned = (statusPart === 'learned' || statusPart === 'true' || statusPart === '1');
                        
                        let pair = "en-pl";
                        if (parts[4] && parts[4].includes('-')) pair = parts[4].trim();

                        return {
                            word: parts[0] || "",
                            translation: parts[1] || "",
                            level: parts[2] || "A1",
                            topic: parts[3] || "General",
                            langPair: pair,
                            learned: isLearned
                        };
                    });
                }

                if (!Array.isArray(parsed) || parsed.length === 0) {
                    alert("Помилка! Файл порожній або має некоректний формат.");
                    return;
                }

                await saveWordsToDB(parsed);
                alert(`Успішно завантажено ${parsed.length} слів у базу IndexedDB!`);
                input.value = '';
                refreshDBFilters();
            } catch (err) {
                alert("Помилка обробки файлу: " + err.message);
            }
        }

        async function openStatsModal() {
            const container = document.getElementById('statsContainer');
            container.innerHTML = "Завантаження...";
            document.getElementById('statsModal').style.display = 'block';

            const words = await getAllDBWords();
            if (words.length === 0) {
                container.innerHTML = "<p>База даних IndexedDB порожня.</p>";
                return;
            }

            const statsByLevel = {};
            words.forEach(w => {
                const lvl = (w.level || "Невідомо").toUpperCase();
                if (!statsByLevel[lvl]) {
                    statsByLevel[lvl] = { total: 0, learned: 0 };
                }
                statsByLevel[lvl].total++;
                if (w.learned) statsByLevel[lvl].learned++;
            });

            let html = `<table style="width:100%; border-collapse:collapse; text-align:left;">
                <thead>
                    <tr style="border-bottom:2px solid var(--border-color);">
                        <th style="padding:8px;">Рівень</th>
                        <th style="padding:8px;">Завантажено</th>
                        <th style="padding:8px;">Вивчено</th>
                        <th style="padding:8px;">Прогрес</th>
                    </tr>
                </thead>
                <tbody>`;

            let grandTotal = 0;
            let grandLearned = 0;

            Object.keys(statsByLevel).sort().forEach(lvl => {
                const item = statsByLevel[lvl];
                grandTotal += item.total;
                grandLearned += item.learned;
                const pct = item.total > 0 ? Math.round((item.learned / item.total) * 100) : 0;
                html += `<tr style="border-bottom:1px solid var(--border-color);">
                    <td style="padding:8px; font-weight:bold;">${lvl}</td>
                    <td style="padding:8px;">${item.total}</td>
                    <td style="padding:8px; color:green;">${item.learned}</td>
                    <td style="padding:8px;">${pct}%</td>
                </tr>`;
            });

            const grandPct = grandTotal > 0 ? Math.round((grandLearned / grandTotal) * 100) : 0;
            html += `<tr style="font-weight:bold; background:rgba(33,150,243,0.1);">
                <td style="padding:8px;">Всього</td>
                <td style="padding:8px;">${grandTotal}</td>
                <td style="padding:8px; color:green;">${grandLearned}</td>
                <td style="padding:8px;">${grandPct}%</td>
            </tr></tbody></table>`;

            container.innerHTML = html;
        }

        async function refreshDBFilters() {
            const isDB = document.getElementById('dictBookSelect').value === 'indexedDB';
            const dbFiltersDiv = document.getElementById('dbFilters');
            dbFiltersDiv.style.display = isDB ? 'block' : 'none';

            if (isDB) {
                const words = await getAllDBWords();
                const levels = new Set(['ALL']);
                const topics = new Set(['ALL']);
                const langPairs = new Set(['ALL']);

                words.forEach(w => {
                    if (w.level) levels.add(w.level.toUpperCase());
                    if (w.topic) topics.add(w.topic);
                    if (w.langPair) langPairs.add(w.langPair.toLowerCase());
                });

                const levelSelect = document.getElementById('dbFilterLevel');
                const topicSelect = document.getElementById('dbFilterTopic');
                const langPairSelect = document.getElementById('dbFilterLangPair');

                const curLvl = levelSelect.value || 'ALL';
                const curTop = topicSelect.value || 'ALL';
                const curLP = langPairSelect.value || 'ALL';

                levelSelect.innerHTML = Array.from(levels).map(l => `<option value="${l}">${l === 'ALL' ? 'Всі рівні' : l}</option>`).join('');
                topicSelect.innerHTML = Array.from(topics).map(t => `<option value="${t}">${t === 'ALL' ? 'Всі теми' : t}</option>`).join('');
                langPairSelect.innerHTML = Array.from(langPairs).map(p => `<option value="${p}">${p === 'ALL' ? 'Всі мовні пари' : p.toUpperCase()}</option>`).join('');

                levelSelect.value = levels.has(curLvl) ? curLvl : 'ALL';
                topicSelect.value = topics.has(curTop) ? curTop : 'ALL';
                langPairSelect.value = langPairs.has(curLP) ? curLP : 'ALL';
            }

            renderDictionaryGroups();
        }

        async function handleClearDB() {
            if (confirm("Ви впевнені, що хочете повністю очистити базу даних IndexedDB?")) {
                await clearDB();
                alert("Базу даних очищено.");
                refreshDBFilters();
            }
        }

        function toggleSection(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.display = (el.style.display === 'none') ? 'block' : 'none';
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initDB();
        });
    </script>
</head>

                                    <option value="en-pl">Англійська ⇄ Польська (EN-PL)</option>
                                    <option value="en-uk">Англійська ⇄ Українська (EN-UK)</option>
                                    <option value="pl-uk">Польська ⇄ Українська (PL-UK)</option>
                                </select>
                                <button onclick="createNewWordInDB()" style="background:#4CAF50; color:white; font-size:12px; padding:8px; margin-top:5px; width:100%;">Зберегти у DB</button>
                            </div>
                        </div>
                    </div>

                    <!-- Секція імпорту та резервних копій -->
                    <div class="collapsible-section">
                        <div class="collapsible-title" onclick="toggleSection('importExportForm')">
                            <span>📥 Імпорт / Експорт (Бекап)</span>
                            <small>▼</small>
                        </div>
                        <div id="importExportForm" style="display:none; margin-top:8px; font-size:12px;">
                            <label style="display:block; margin-bottom:5px;"><strong>Імпорт з файлу (.json, .txt, .csv):</strong></label>
                            <input type="file" id="dbFileInput" accept=".json, .txt, .csv" style="width:100%; margin-bottom:8px; font-size:11px;">
                            
                            <div style="display:flex; gap:5px; margin-bottom:10px;">
                                <button onclick="processDBImportFile()" style="background:#2196F3; color:white; flex:1; font-size:12px; padding:6px;">Завантажити файл</button>
                                <button onclick="handleClearDB()" style="background:#d32f2f; color:white; flex:1; font-size:12px; padding:6px;">Очистити DB</button>
                            </div>

                            <label style="display:block; margin-bottom:5px;"><strong>Експорт бекапу:</strong></label>
                            <div style="display:flex; gap:5px;">
                                <button onclick="exportDBData('json')" style="background:#009688; color:white; flex:1; font-size:12px; padding:6px;">Eкспорт JSON</button>
                                <button onclick="exportDBData('txt')" style="background:#ff9800; color:white; flex:1; font-size:12px; padding:6px;">Експорт TXT</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div style="margin-bottom: 15px;">
                <label style="font-size: 14px;"><strong>Оберіть мовну пару для вивчення:</strong></label>
                <select id="dictPairSelect" onchange="renderDictionaryGroups()">
                    <option value="en-pl">Англійська ⇄ Польська</option>
                    <option value="en-uk">Англійська ⇄ Українська</option>
                    <option value="pl-uk">Польська ⇄ Українська</option>
                </select>
            </div>
            
            <div id="dictGroupsContainer"></div>
            
            <button onclick="document.getElementById('dictModal').style.display='none'" style="background:#333; color:white; width:100%; margin-top:20px;">Закрити</button>
        </div>
    </div>

    <!-- Модальне вікно Форми Редагування Запису IndexedDB -->
    <div id="editModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:var(--modal-bg); z-index:1100; overflow-y:auto; padding:20px; box-sizing:border-box;">
        <div style="background:var(--modal-content-bg); color:var(--text-color); border-radius:15px; padding:20px; max-width:450px; margin:40px auto 0 auto; box-shadow: 0 4px 15px rgba(0,0,0,0.4);">
            <div class="modal-header">
                <h2>✏️ Редагувати слово</h2>
                <button class="close-icon-btn" onclick="document.getElementById('editModal').style.display='none'" title="Закрити">✖</button>
            </div>

            <div class="edit-form-group">
                <label>Слово / Вираз:</label>
                <input type="text" id="editWordInput">
            </div>

            <div class="edit-form-group">
                <label>Переклад:</label>
                <input type="text" id="editTransInput">
            </div>

            <div style="display:flex; gap:10px;">
                <div class="edit-form-group" style="flex:1;">
                    <label>Рівень:</label>
                    <input type="text" id="editLevelInput" placeholder="A1">
                </div>
                <div class="edit-form-group" style="flex:1;">
                    <label>Тема:</label>
                    <input type="text" id="editTopicInput" placeholder="General">
                </div>
            </div>

            <div class="edit-form-group">
                <label>Мовна пара (Шифр):</label>
                <select id="editLangPairInput">
                    <option value="en-pl">Англійська ⇄ Польська (EN-PL)</option>
                    <option value="en-uk">Англійська ⇄ Українська (EN-UK)</option>
                    <option value="pl-uk">Польська ⇄ Українська (PL-UK)</option>
                </select>
            </div>

            <div class="edit-form-group">
                <label>Статус вивчення:</label>
                <select id="editLearnedSelect">
                    <option value="false">❌ Не вивчено</option>
                    <option value="true">✔ Вивчено</option>
                </select>
            </div>

            <div style="display:flex; gap:10px; margin-top:15px;">
                <button onclick="saveWordChanges()" style="background:#4CAF50; color:white; flex:1;">Зберегти</button>
                <button onclick="document.getElementById('editModal').style.display='none'" style="background:#777; color:white; flex:1;">Скасувати</button>
            </div>
        </div>
    </div>

    <!-- Модальне вікно Статистики DB -->
    <div id="statsModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:var(--modal-bg); z-index:1000; overflow-y:auto; padding:20px; box-sizing:border-box;">
        <div style="background:var(--modal-content-bg); color:var(--text-color); border-radius:15px; padding:20px; max-width:600px; margin:0 auto; box-shadow: 0 4px 15px rgba(0,0,0,0.3);">
            <div class="modal-header">
                <h2>📊 Статистика слів у IndexedDB</h2>
                <button class="close-icon-btn" onclick="document.getElementById('statsModal').style.display='none'" title="Закрити">✖</button>
            </div>
            
            <div id="statsContainer"></div>

            <button onclick="document.getElementById('statsModal').style.display='none'" style="background:#333; color:white; width:100%; margin-top:20px;">Закрити</button>
        </div>
    </div>
</body>
</html>
